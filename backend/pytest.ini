[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=core --cov=services --cov=agents --cov-report=term-missing:skip-covered
filterwarnings = ignore::DeprecationWarning
markers =
    integration: 需要真实后端运行态的集成测试

[coverage:run]
source = core,services,agents
omit = */__pycache__/*,*/tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
