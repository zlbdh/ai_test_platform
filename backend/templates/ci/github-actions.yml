# ============================================================================
# AI Test Platform — GitHub Actions 模板
#
# 使用方法:
# 1. 将此文件复制到你的项目 .github/workflows/ 目录
# 2. 配置 AITEST_API_URL secret（你的平台地址）
# 3. 推送代码后自动触发 AI 测试
# ============================================================================

name: AI Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # 支持手动触发
  workflow_dispatch:
    inputs:
      test_url:
        description: '测试目标 URL'
        required: true
        default: 'https://example.com'
      test_goal:
        description: '测试指令'
        required: true
        default: '验证首页正常加载'

env:
  AITEST_API_URL: ${{ secrets.AITEST_API_URL || 'http://localhost:8020' }}

jobs:
  ai-test:
    name: 🤖 AI 端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🏥 检查平台健康
        run: |
          python aitest.py health || echo "⚠️ 平台未就绪，跳过测试"

      - name: 🚀 执行 AI 测试
        run: |
          python aitest.py run \
            --url "${{ github.event.inputs.test_url || env.DEFAULT_URL || 'https://example.com' }}" \
            --goal "${{ github.event.inputs.test_goal || '验证首页正常加载并检查关键元素' }}" \
            --wait \
            --timeout 120 \
            --output junit

      - name: 📊 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: test-results-*.xml

      - name: 📋 发布测试结果
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results-*.xml'
          fail_on_failure: true
          detailed_summary: true

  # ── 可选: 部署后回归测试 ──
  regression-test:
    name: 🔄 部署后回归
    needs: [ai-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔄 执行回归测试套件
        run: |
          python aitest.py run \
            --url "${{ secrets.STAGING_URL || 'https://staging.example.com' }}" \
            --goal "执行完整回归测试：首页、登录、搜索、个人中心" \
            --mode deep \
            --wait \
            --timeout 300 \
            --output junit

      - name: 📊 上传回归报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: test-results-*.xml
