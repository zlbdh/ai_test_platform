# ============================================================================
# AI Test Platform — GitHub Actions template
#
# Usage:
# 1. Copy this file to your project's .github/workflows/ directory
# 2. Configure the AITEST_API_URL secret with your platform URL
# 3. Automatically run AI tests when code is pushed
# ============================================================================

name: AI Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Support manual execution
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Test target URL'
        required: true
        default: 'https://example.com'
      test_goal:
        description: 'Test instructions'
        required: true
        default: 'Verify that the home page loads correctly'

env:
  AITEST_API_URL: ${{ secrets.AITEST_API_URL || 'http://localhost:8020' }}

jobs:
  ai-test:
    name: 🤖 AI end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🏥 Check platform health
        run: |
          python aitest.py health || echo "⚠️ Platform is not ready; skipping tests"

      - name: 🚀 Run AI tests
        run: |
          python aitest.py run \
            --url "${{ github.event.inputs.test_url || env.DEFAULT_URL || 'https://example.com' }}" \
            --goal "${{ github.event.inputs.test_goal || 'Verify that the home page loads correctly and check key elements' }}" \
            --wait \
            --timeout 120 \
            --output junit

      - name: 📊 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: test-results-*.xml

      - name: 📋 Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results-*.xml'
          fail_on_failure: true
          detailed_summary: true

  # ── Optional: regression tests after deployment ──
  regression-test:
    name: 🔄 Regression after deployment
    needs: [ai-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔄 Run the regression test suite
        run: |
          python aitest.py run \
            --url "${{ secrets.STAGING_URL || 'https://staging.example.com' }}" \
            --goal "Run a full regression test: home page, login, search, and account page" \
            --mode deep \
            --wait \
            --timeout 300 \
            --output junit

      - name: 📊 Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: test-results-*.xml
