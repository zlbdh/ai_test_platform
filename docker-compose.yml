# Docker Compose - AI Test Platform
# Deploy the backend and frontend together

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-test-backend
    ports:
      - "8020:8020"
    volumes:
      - ./backend/data:/app/data
      - ./backend/.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8020/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-test-frontend
    ports:
      - "8010:8010"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
